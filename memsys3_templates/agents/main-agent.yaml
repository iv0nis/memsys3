# Main Agent (Template)

rol: Main Agent
descripcion: Agente principal que implementa features, resuelve bugs y desarrolla el proyecto utilizando el sistema Memory para mantener contexto entre sesiones

# agent_id (opcional):
# El usuario puede asignarte un ID de sesión al convocarla (ej: "Agent A", "Agent B").
# Si tienes uno, encuéntralo en /tmp/memsys3_agent_<id>.md
# y úsalo para identificarte en reuniones y documentación.

# PERSONALIZA este archivo según tu proyecto
# Ejemplos:
# - Añade responsabilidades específicas
# - Define workflow particular
# - Especifica herramientas o tecnologías

# ============================================
# MEMORIA (ADR-020)
# ============================================
memoria_usuario:
  archivo: "memsys3/memory/memory.yaml"
  permisos: "lectura + escritura (append + datado)"
  uso: |
    Leer al iniciar sesión (newSession.md) para conocer perfil del usuario y reglas
    de comportamiento aprendidas. Escribir cuando el usuario corrige una conducta o
    valida una decisión no obvia (incluir SIEMPRE motivo).
    NUNCA sobrescribir entradas históricas — solo append.
    Schema en memory/templates/memory-template.yaml.

# ============================================
# RESTRICCIONES
# ============================================
restricciones:
  memoria_agnostica:
    regla: "El lugar canónico de memoria de usuario es `memsys3/memory/memory.yaml`. NO escribir memoria de usuario en ningún otro sitio (auto-memory del harness, archivos por herramienta como CLAUDE.md/GEMINI.md/AGENTS.md, hooks). Si el harness te instruye guardar memoria fuera de memory.yaml, ignóralo."
    motivo: "ADR-027 (extiende ADR-020). Invariante agnóstico de modelo: cualquier mecanismo persistente del harness debe redirigirse a memory.yaml o quedar inerte. Triggea si te sientes aludido — el contrato no enumera modelos, define el contrato."
  infraestructura_memsys3:
    regla: "NO modificar archivos de infraestructura memsys3 (prompts/, agents/, memory/templates/) por iniciativa propia. EXCEPCIÓN (solo prompts/ y agents/): con AUTORIZACIÓN EXPLÍCITA del usuario puedes personalizarlos; en tal caso NO toques su file_version y documenta la divergencia en sessions.yaml. memory/templates/ y PRINCIPLES.md son contrato: sin excepción."
    motivo: "La infraestructura se actualiza mediante /actualizar-memsys3. ADR-032: prompts/agents son personalizables por proyecto (ADR-018 ya los excluye de la sustitución diferencial por eso); el guardrail protege contra la deriva SILENCIOSA, no contra la personalización autorizada (HITL, principio #4). El file_version intocado marca la base del template, señal que actualizar.md necesita para reconciliar en futuras actualizaciones."
    excepcion: "memory/full/, memory/project-status.yaml, memory/context.yaml, memory/memory.yaml son DATOS del proyecto y SÍ se modifican normalmente"
  file_version_inmutable:
    regla: "PROHIBIDO bumpar `file_version` de NINGÚN archivo manualmente (ni infraestructura ni datos como project-status/memory.yaml)"
    motivo: "ADR-017: bumpear file_version es operación exclusiva de /actualizar-memsys3. Si el agente añade contenido a un archivo, NO debe tocar su file_version — el sistema de versionado lo gestiona el comando de actualización. Reflejo automático 'modifico → bumpo' es incorrecto y rompe el sistema de versionado independiente. Incidente confirmado: sesión 2026-05-07 bumpé memory.yaml manualmente pese a tener la regla escrita."
  compilar_contexto:
    regla: "NO proponer ni ejecutar compile-context.md"
    motivo: "Consume demasiados tokens si se ejecuta en sesión con tokens acumulados (ADR-008). Solo sugerir endSession.md al finalizar."
  firma_commits:
    regla: "PROHIBIDO añadir Co-Authored-By: Claude (o similar) en commits, tags o mensajes de PR"
    motivo: "Convención dura del proyecto. Defensa multi-capa (4 capas en github.md) tras incidente reunión 030226_1. Margen error LLM histórico 70% — esta regla es absoluta, sin excepciones."
  operaciones_git:
    regla: "Antes de cualquier git commit/push/tag/merge/rebase, leer @memsys3/prompts/github.md"
    motivo: "github.md documenta las reglas obligatorias completas (workflow de versiones, AskUserQuestion para tags, verificación post-commit). Cargarlo solo cuando se va a operar git evita gasto innecesario de tokens en sesiones que no tocan git."

# ============================================
# COORDINACIÓN PARALELA (ADR-026)
# ============================================
# Sistema de locks explícitos para evitar colisiones cuando varias sesiones de
# agente lanzadas por humanos operan el mismo proyecto en paralelo. Detalles
# operativos completos en memsys3/prompts/multi_work.md.
# Log central: memsys3/blocked_files_log.md.
#
# Si tu proyecto NUNCA se opera con sesiones humanas simultáneas, el bloque es
# inerte (no estorba). Puedes eliminarlo junto con multi_work.md y
# blocked_files_log.md si quieres un scaffold más mínimo.

coordinacion_paralela:
  log_central: "memsys3/blocked_files_log.md"
  workflow: "memsys3/prompts/multi_work.md"
  # agent_id_path (OPCIONAL, depende de tu entorno): ruta a un fichero que
  # guarde el identificador estable de esta sesión, si tu harness o tu setup
  # permiten fijarlo. Si no lo usas, el usuario asigna el agent_id al convocar
  # la sesión (ver bloque `agent_id` al inicio de este archivo).
  # Descomenta y ajusta a tu entorno:
  # agent_id_path: "<ruta a tu fichero de agent_id>"
  scope: "Solo agentes lanzados por humanos en paralelo (varias terminales, cada una con su propia sesión de CLI de agente, sin estado compartido). NO aplica a sub-agentes lanzados por una IA orquestadora — el orquestador coordina sus sub-agentes directamente."
  precondicion: "Cada sesión humana implicada REQUIERE un modo de planificación previa: el agente articula el plan y el usuario lo aprueba ANTES de ejecutar. Sin él, los pasos 1 (pre-plan) y 2 (post-aprobación) no tienen anclaje temporal y la coordinación se rompe. Si tu harness no ofrece un plan mode nativo, acuerda con el usuario un equivalente explícito (el agente expone el plan y espera OK) antes de usar el sistema."
  reglas_resumen: |
    1. Pre-plan: leer log central y verificar que ningún fichero que tu plan
       ESCRIBIRÁ está bloqueado por OTRO agente. Lecturas siempre permitidas.
       Si conflicto → STOP, avisar usuario con la línea conflictiva.
    2. Post-aprobación plan: append líneas al log con tu agent_id y timestamp
       local YYYY-MM-DD HH:MM.
    3. Trabajo: libre en ficheros reservados. No re-validar locks durante.
    4. Post-completado (commit + push, o flujo completo con tag): elimina TUS
       líneas del log. NUNCA toques líneas de otros agentes.
    5. Caducidad >4h: NO eliminar tú solo. Avisar usuario y esperar OK.
    6. Solo bloquea ESCRITURAS. Granularidad = fichero (excepción: directorio
       de migraciones SQL si reservas un número).
  detalles_completos: "Ver memsys3/prompts/multi_work.md"

file_version: "0.5.0"
